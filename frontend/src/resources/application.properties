# 1. Cấu hình Port cho Backend (khớp với React đang gọi)
server.port=8081

# 2. Cấu hình kết nối MySQL (Cổng 3307 theo Docker của bạn)
spring.datasource.url=jdbc:mysql://localhost:3307/phone_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Thay '123456' bằng mật khẩu MySQL của bạn nếu khác
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Cấu hình tự động xóa và tạo lại bảng (GIẢI PHÁP CHO BẠN)
# Dòng này sẽ xóa sạch DB cũ và chạy lại DataLoader mỗi khi bạn START app
spring.jpa.hibernate.ddl-auto=update

# 4. Hiển thị các câu lệnh SQL trong Terminal để dễ theo dõi lỗi
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. Cấu hình để tránh lỗi font tiếng Việt khi nạp dữ liệu
spring.datasource.sql-script-encoding=UTF-8